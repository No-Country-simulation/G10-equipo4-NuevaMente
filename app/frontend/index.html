<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Google+Sans:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root {
    --color-primario: #0B57D0;
    --color-on-primario: #FFFFFF;
    --color-primario-container: #D3E3FD;
    --color-on-primario-container: #041E49;
    --color-secundario-container: #C2E7FF;
    --color-superficie: #F4F7FC;
    --color-on-superficie: #111827;
    --color-on-superficie-variante: #4B5563;
    --color-contorno: #111827;
    --sombra-sm: 4px 4px 0px var(--color-contorno);
    --sombra-md: 6px 6px 0px var(--color-contorno);
    --mouse-x: 0;
    --mouse-y: 0;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--color-superficie);
    color: var(--color-on-superficie);
    margin: 0;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  h1, h2, h3 { font-family: 'Google Sans', sans-serif; margin: 0; }

  .fondo-ambiental { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }

  .blob {
    position: absolute;
    border: 4px solid var(--color-contorno);
    box-shadow: var(--sombra-md);
    opacity: 0.85;
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    translate: calc(var(--mouse-x) * var(--parallax)) calc(var(--mouse-y) * var(--parallax));
    transition: translate 0.4s ease-out;
  }

  .blob-1 { width: 220px; height: 220px; background: #FEF08A; top: -60px; left: -60px; --parallax: -40px; }
  .blob-2 { width: 180px; height: 180px; background: var(--color-secundario-container); bottom: -50px; right: -40px; --parallax: 60px; }

  .contenedor-principal { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  .tarjeta-formulario {
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid var(--color-contorno);
    box-shadow: var(--sombra-md);
    border-radius: 24px 8px 24px 24px;
    padding: 32px;
  }

  .titulo-form { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }

  .zona-drop {
    border: 3px dashed var(--color-contorno);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    color: var(--color-on-superficie-variante);
    font-weight: 600;
    transition: background 0.15s;
  }
  .zona-drop.sobre-zona, .zona-drop:hover { background: var(--color-primario-container); }
  .zona-drop .material-symbols-rounded { font-size: 40px; display: block; margin-bottom: 8px; }

  .fila-selects { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 24px; }
  .fila-selects label { display: block; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: var(--color-primario); }
  .fila-selects select {
    width: 100%; padding: 10px 12px; border: 2px solid var(--color-contorno); border-radius: 8px;
    font-family: 'Montserrat', sans-serif; font-weight: 600; background: #FFFFFF;
  }

  .boton-primario {
    margin-top: 24px; display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border-radius: 9999px; border: 2px solid var(--color-contorno);
    background: var(--color-primario); color: var(--color-on-primario);
    font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .boton-primario:hover { transform: translate(-2px, -2px); box-shadow: var(--sombra-sm); }

  .tarjeta-resultado {
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid var(--color-contorno);
    box-shadow: var(--sombra-md);
    border-radius: 8px 24px 24px 24px;
    padding: 32px;
    margin-top: 24px;
  }
  .intro-resultado { color: var(--color-on-superficie-variante); font-weight: 500; margin-top: 8px; }

  .grid-flashcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
  .flashcard-3d { height: 170px; cursor: pointer; perspective: 1000px; }
  .flashcard-interior { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .flashcard-3d.volteada .flashcard-interior { transform: rotateY(180deg); }
  .flashcard-cara {
    position: absolute; inset: 0; backface-visibility: hidden;
    border: 3px solid var(--color-contorno); border-radius: 16px; padding: 16px;
    overflow-y: auto; box-shadow: var(--sombra-sm);
  }
  .flashcard-frente {
    background: var(--color-primario-container); color: var(--color-on-primario-container);
    font-weight: 700; display: flex; align-items: center; font-size: 1.05rem;
  }
  .flashcard-dorso { background: #FFFFFF; transform: rotateY(180deg); font-size: 0.85rem; }
  .flashcard-dorso em { display: block; margin-top: 8px; color: var(--color-on-superficie-variante); }
</style>
</head>
<body>
  <div class="fondo-ambiental">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="contenedor-principal">
    <div class="tarjeta-formulario">
      <h2 class="titulo-form"><span class="material-symbols-rounded">upload_file</span> Sube tu documento tecnico</h2>

      <div class="zona-drop" id="zona-drop">
        <span class="material-symbols-rounded">description</span>
        <p id="nombre-archivo">Arrastra tu PDF, MD o TXT aqui, o haz clic</p>
        <input type="file" id="archivo" accept=".pdf,.md,.txt" hidden>
      </div>

      <div class="fila-selects">
        <div><label>Perfil</label><select id="perfil"></select></div>
        <div><label>Formato</label><select id="formato"></select></div>
        <div><label>Nicho</label><select id="nicho"></select></div>
        <div><label>Nivel</label><select id="nivel"></select></div>
      </div>

      <button id="btn-generar" class="boton-primario">
        <span class="material-symbols-rounded">auto_awesome</span> Generar
      </button>
    </div>

    <div id="resultado"></div>
  </div>

  <script>
    function enviarAStreamlit(tipo, datos) {
      window.parent.postMessage({ isStreamlitMessage: true, type: tipo, ...datos }, "*");
    }

    function ajustarAltura() {
      enviarAStreamlit("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
    }

    function llenarSelect(id, valores) {
      const select = document.getElementById(id);
      if (select.options.length > 0) return;
      valores.forEach((valor) => {
        const opcion = document.createElement("option");
        opcion.value = valor;
        opcion.textContent = valor;
        select.appendChild(opcion);
      });
    }

    function mostrarResultado(resultado) {
      const contenedor = document.getElementById("resultado");
      if (!resultado) { contenedor.innerHTML = ""; return; }
      const contenido = resultado.contenido_adaptado;
      let html = `
        <div class="tarjeta-resultado">
          <h2>${contenido.titulo}</h2>
          <p class="intro-resultado">${contenido.introduccion_contextualizada}</p>
          <div class="grid-flashcards">`;
      contenido.items.forEach((item) => {
        html += `
            <div class="flashcard-3d" onclick="this.classList.toggle('volteada')">
              <div class="flashcard-interior">
                <div class="flashcard-cara flashcard-frente">${item.frente}</div>
                <div class="flashcard-cara flashcard-dorso"><p>${item.dorso}</p><em>${item.pista_didactica}</em></div>
              </div>
            </div>`;
      });
      html += `</div></div>`;
      contenedor.innerHTML = html;
    }

    window.addEventListener("message", (evento) => {
      if (evento.data.type !== "streamlit:render") return;
      const { opciones, resultado } = evento.data.args;
      llenarSelect("perfil", opciones.perfiles);
      llenarSelect("formato", opciones.formatos);
      llenarSelect("nicho", opciones.nichos);
      llenarSelect("nivel", opciones.niveles);
      mostrarResultado(resultado);
      ajustarAltura();
    });

    const zonaDrop = document.getElementById("zona-drop");
    const inputArchivo = document.getElementById("archivo");

    function actualizarNombreArchivo() {
      const archivo = inputArchivo.files[0];
      document.getElementById("nombre-archivo").textContent = archivo
        ? archivo.name
        : "Arrastra tu PDF, MD o TXT aqui, o haz clic";
    }

    zonaDrop.addEventListener("click", () => inputArchivo.click());
    zonaDrop.addEventListener("dragover", (e) => { e.preventDefault(); zonaDrop.classList.add("sobre-zona"); });
    zonaDrop.addEventListener("dragleave", () => zonaDrop.classList.remove("sobre-zona"));
    zonaDrop.addEventListener("drop", (e) => {
      e.preventDefault();
      zonaDrop.classList.remove("sobre-zona");
      inputArchivo.files = e.dataTransfer.files;
      actualizarNombreArchivo();
    });
    inputArchivo.addEventListener("change", actualizarNombreArchivo);

    document.getElementById("btn-generar").addEventListener("click", () => {
      const archivo = inputArchivo.files[0];
      if (!archivo) { alert("Selecciona un documento"); return; }
      const lector = new FileReader();
      lector.onload = () => {
        enviarAStreamlit("streamlit:setComponentValue", {
          value: {
            accion: "generar",
            id: Date.now(),
            archivo_nombre: archivo.name,
            archivo_base64: lector.result.split(",")[1],
            perfil: document.getElementById("perfil").value,
            formato: document.getElementById("formato").value,
            nicho: document.getElementById("nicho").value,
            nivel: document.getElementById("nivel").value,
          },
          dataType: "json",
        });
      };
      lector.readAsDataURL(archivo);
    });

    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      document.documentElement.style.setProperty("--mouse-x", x);
      document.documentElement.style.setProperty("--mouse-y", y);
    });

    enviarAStreamlit("streamlit:componentReady", { apiVersion: 1 });
    ajustarAltura();
  </script>
</body>
</html>
