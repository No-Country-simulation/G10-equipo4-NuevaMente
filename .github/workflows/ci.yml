name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# El CI solo lee el codigo: el token de GitHub no necesita permisos de escritura
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
